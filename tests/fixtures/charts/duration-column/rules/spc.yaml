# type: duration (#117): text with a unit, substituted as it is — in a range
# and in `for`, one read with its default when the row leaves it out.
columns:
  job:  { type: string, required: true }
  win:  { type: duration, required: true }
  hold: { type: duration, default: 5m }

rules:
  - alert: SpcErrors
    expr: rate(spc_errors_total{job="${job}"}[${win}]) > 0
    for: ${hold}
    labels: { severity: warning }
