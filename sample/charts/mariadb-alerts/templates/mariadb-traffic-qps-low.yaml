{{- $chunks := chunk 100 ($.Values.mariadb_traffic_qps_low | default list) }}
{{- range $chunkIndex, $rows := $chunks }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $.Release.Name }}-mariadb-traffic-qps-low-1-{{ add1 $chunkIndex }}
  labels:
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: mariadb-traffic-qps-low
      rules:
        {{- $common := $.Values._common | default dict }}
        {{- range $rows }}
        {{- $row := merge . $common }}
        - alert: MariadbTrafficQpsLow_MinQps
          expr: |-
            rate(mysql_global_status_questions{namespace="{{ dig "namespace" `default` $row }}"}[5m]) < {{ dig "min_qps" 10 $row }}
          for: 10m
          labels:
            severity: warning
            owner: "{{ $row.owner }}"
            namespace: "{{ dig "namespace" `default` $row }}"
          annotations:
            summary: |-
              MariadbTrafficQpsLow_MinQps triggered on {{ $row.owner }}
        {{- end }}
{{- end }}
