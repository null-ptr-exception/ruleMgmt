# Prometheus 3: `type: prometheus3` is a PrometheusRule like a group with no
# type, marked with the annotation alertforge.io/profile: prometheus3 so
# Preview and import can tell it apart, and checked with promtool 3. 3.x
# reads what 2.x refuses: a UTF-8 label name (service.name) and an offset of
# 0, so a duration column whose default is 0s may go into an offset here.
type: prometheus3
interval: 1m

columns:
  job:   { type: string, required: true }
  warn:  { type: number, default: 1 }
  shift: { type: duration, default: 0s }

rules:
  - alert: ApiErrors
    expr: 'rate(http_errors_total{job="${job}"}[5m] offset ${shift}) > ${warn}'
    for: 2m
    labels: { severity: warning, service.name: '${job}' }
    annotations: { summary: '{{ $labels.job }}: {{ $value }} errors/s' }
