group: mariadb_saturation_disk

columns:
  warn_pct: {type: number, default: 75, description: Disk usage warning (%)}
  critical_pct: {type: number, default: 90, description: Disk usage critical (%)}

rules:
  - alert: MariadbSaturationDisk_WarnPct
    expr: (kubelet_volume_stats_used_bytes{namespace="${namespace}"} / kubelet_volume_stats_capacity_bytes{namespace="${namespace}"}) * 100 > ${warn_pct}
    for: 10m
    labels:
      severity: warning
      owner: ${owner}
      namespace: ${namespace}
    annotations:
      summary: MariadbSaturationDisk_WarnPct triggered on ${owner}
  - alert: MariadbSaturationDisk_CriticalPct
    expr: (kubelet_volume_stats_used_bytes{namespace="${namespace}"} / kubelet_volume_stats_capacity_bytes{namespace="${namespace}"}) * 100 > ${critical_pct}
    for: 10m
    labels:
      severity: critical
      owner: ${owner}
      namespace: ${namespace}
    annotations:
      summary: MariadbSaturationDisk_CriticalPct triggered on ${owner}
