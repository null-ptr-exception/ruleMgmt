{{- $chunks := chunk 100 ($.Values.svc | default list) }}
{{- range $chunkIndex, $rows := $chunks }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $.Release.Name }}-svc-1-{{ add1 $chunkIndex }}
  labels:
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: svc
      rules:
        {{- range $rows }}
        - alert: "{{ `{}}` }}"
          expr: |-
            up{host="{{ .host }}"} == 0
        - alert: a{"b":{{ `{}}` }}
          expr: |-
            up{host="{{ .host }}"} == 0
        - alert: "{{ `{{{` }} .x {{ `}}}` }}"
          expr: |-
            up{host="{{ .host }}"} == 0
        - alert: x{ {{ `{}}}` }} {
          expr: |-
            up{host="{{ .host }}"} == 0
        {{- end }}
{{- end }}
