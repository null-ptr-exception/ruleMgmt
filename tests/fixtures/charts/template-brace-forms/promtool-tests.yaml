# rule_files is filled in by the harness: one file per rendered object.
evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'up{host="h1"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: Down
        exp_alerts:
          - exp_labels: { host: h1, tag: "a{{", quoted: 'a"b', wrapped: "{h1}" }
            exp_annotations:
              raw: raw is 0
              printf: x/h1
              next: h1h1{h1}
