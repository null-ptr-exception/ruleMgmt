{{- $chunks := chunk 100 ($.Values.error_rate | default list) }}
{{- range $chunkIndex, $rows := $chunks }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $.Release.Name }}-error-rate-1-{{ add1 $chunkIndex }}
  labels:
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: error-rate
      rules:
        {{- range $rows }}
        - alert: ErrorRateHigh
          expr: sum(rate(errors_total{job="{{ .job }}"}[{{ .window | default `5m` }}])) / sum(rate(requests_total{job="{{ .job }}"}[{{ .window | default `5m` }}])) > {{ .threshold | default 0.05 }}
          for: {{ .window | default `5m` }}
          labels:
            severity: "{{ .severity | default `warning` }}"
          annotations:
            summary: "error ratio {{ `{{ $value | humanizePercentage }}` }} for {{ .job }}"
        {{- end }}
{{- end }}
