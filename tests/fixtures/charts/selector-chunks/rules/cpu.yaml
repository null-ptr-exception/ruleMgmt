# 102 rows: the base row is in the first chunk, its exception (row 102) in
# the second. The helper scans every row, so the base still excludes it.
selectors: [namespace, workload]

columns:
  namespace: { type: string, required: true }
  workload:  { type: string, default: ".*" }
  threshold: { type: number, default: 80 }

rules:
  - alert: CpuHigh
    expr: cpu_usage{${selector}} > ${threshold}
    for: 1m
    labels: { severity: warning }
