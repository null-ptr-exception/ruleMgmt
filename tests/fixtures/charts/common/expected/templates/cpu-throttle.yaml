{{- $chunks := chunk 100 ($.Values.cpu_throttle | default list) }}
{{- range $chunkIndex, $rows := $chunks }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $.Release.Name }}-cpu-throttle-1-{{ add1 $chunkIndex }}
  labels:
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: cpu-throttle
      rules:
        {{- $common := $.Values._common | default dict }}
        {{- range $rows }}
        {{- $row := merge . $common }}
        - alert: CPUThrottled
          expr: |-
            throttle_ratio{cluster="{{ $row.cluster }}", namespace="{{ $row.namespace }}"} > 0.5
          for: 15m
          labels:
            severity: info
        {{- end }}
{{- end }}
