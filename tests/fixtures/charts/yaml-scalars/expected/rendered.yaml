# Hand-written — never generated. See tests/blind/harness.js.
# `for` is not set on these rules: the generator's default of 5m applies.
blind-probe-1-1:
  - name: probe
    rules:
      - alert: TargetDown
        expr: '{job="api", __name__="up"} == 0'
        for: 5m
        labels: { severity: critical }
      - alert: VersionSkew
        expr: 'count(count by (v) (label_replace(build_info{job="api"}, "v", "$1", "version", "(.*): .*"))) > 1'
        for: 5m
        labels: { severity: warning }
      - alert: Flapping
        expr: 'changes(up{job="api"}[15m]) > 4 # restarts, not scrapes'
        for: 5m
        labels: { severity: info }
