{{- $chunks := chunk 100 ($.Values.disk | default list) }}
{{- range $chunkIndex, $rows := $chunks }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $.Release.Name }}-disk-1-{{ add1 $chunkIndex }}
  labels:
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: disk
      rules:
        {{- range $rows }}
        - alert: DiskFull
          expr: |-
            disk_free_bytes{device="{{ .device }}"} == 0
          labels:
            severity: critical
        - alert: DiskLow
          expr: |-
            disk_free_bytes{device="{{ .device }}"} < 1000
          for: 10m
          labels:
            severity: warning
        {{- end }}
{{- end }}
