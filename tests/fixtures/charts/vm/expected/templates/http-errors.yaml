{{- $chunks := chunk 100 ($.Values.http_errors | default list) }}
{{- range $chunkIndex, $rows := $chunks }}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: {{ $.Release.Name }}-http-errors-1-{{ add1 $chunkIndex }}
  labels:
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: http-errors
      type: prometheus
      interval: 1m
      rules:
        {{- range $rows }}
        - alert: HTTPErrors
          expr: |-
            WITH (errs = rate(http_errors_total{job="{{ .job }}"}[5m])) errs > {{ dig "warn" 5 . }}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: |-
              {{ `{{ $labels.job }}` }}: {{ `{{ $value }}` }} errors/s
        - alert: HTTPErrorsShifted
          expr: |-
            rollup_rate(http_errors_total{job="{{ .job }}"}[1h] offset {{ dig "shift" `0s` . }}) > {{ dig "warn" 5 . }}
          labels:
            severity: info
        {{- end }}
{{- end }}
