{{- $chunks := chunk 100 ($.Values.mariadb_saturation_disk | default list) }}
{{- range $chunkIndex, $rows := $chunks }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $.Release.Name }}-mariadb-saturation-disk-1-{{ add1 $chunkIndex }}
  labels:
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: mariadb-saturation-disk
      rules:
        {{- $common := $.Values._common | default dict }}
        {{- range $rows }}
        {{- $row := merge . $common }}
        - alert: MariadbSaturationDisk_WarnPct
          expr: |-
            (kubelet_volume_stats_used_bytes{namespace="{{ dig "namespace" `default` $row }}"} / kubelet_volume_stats_capacity_bytes{namespace="{{ dig "namespace" `default` $row }}"}) * 100 > {{ dig "warn_pct" 75 $row }}
          for: 10m
          labels:
            severity: warning
            owner: "{{ $row.owner }}"
            namespace: "{{ dig "namespace" `default` $row }}"
          annotations:
            summary: |-
              MariadbSaturationDisk_WarnPct triggered on {{ $row.owner }}
        - alert: MariadbSaturationDisk_CriticalPct
          expr: |-
            (kubelet_volume_stats_used_bytes{namespace="{{ dig "namespace" `default` $row }}"} / kubelet_volume_stats_capacity_bytes{namespace="{{ dig "namespace" `default` $row }}"}) * 100 > {{ dig "critical_pct" 90 $row }}
          for: 10m
          labels:
            severity: critical
            owner: "{{ $row.owner }}"
            namespace: "{{ dig "namespace" `default` $row }}"
          annotations:
            summary: |-
              MariadbSaturationDisk_CriticalPct triggered on {{ $row.owner }}
        {{- end }}
{{- end }}
