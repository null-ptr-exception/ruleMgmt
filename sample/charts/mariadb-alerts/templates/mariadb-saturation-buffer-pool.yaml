{{- $chunks := chunk 100 ($.Values.mariadb_saturation_buffer_pool | default list) }}
{{- range $chunkIndex, $rows := $chunks }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $.Release.Name }}-mariadb-saturation-buffer-pool-1-{{ add1 $chunkIndex }}
  labels:
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: mariadb-saturation-buffer-pool
      rules:
        {{- $common := $.Values._common | default dict }}
        {{- range $rows }}
        {{- $row := merge . $common }}
        - alert: MariadbSaturationBufferPool_WarnPct
          expr: |-
            (1 - mysql_global_status_innodb_buffer_pool_pages_free{namespace="{{ dig "namespace" `default` $row }}"} / mysql_global_status_innodb_buffer_pool_pages_total{namespace="{{ dig "namespace" `default` $row }}"}) * 100 > {{ dig "warn_pct" 85 $row }}
          for: 10m
          labels:
            severity: warning
            owner: "{{ $row.owner }}"
            namespace: "{{ dig "namespace" `default` $row }}"
          annotations:
            summary: |-
              MariadbSaturationBufferPool_WarnPct triggered on {{ $row.owner }}
        - alert: MariadbSaturationBufferPool_CriticalPct
          expr: |-
            (1 - mysql_global_status_innodb_buffer_pool_pages_free{namespace="{{ dig "namespace" `default` $row }}"} / mysql_global_status_innodb_buffer_pool_pages_total{namespace="{{ dig "namespace" `default` $row }}"}) * 100 > {{ dig "critical_pct" 95 $row }}
          for: 10m
          labels:
            severity: critical
            owner: "{{ $row.owner }}"
            namespace: "{{ dig "namespace" `default` $row }}"
          annotations:
            summary: |-
              MariadbSaturationBufferPool_CriticalPct triggered on {{ $row.owner }}
        {{- end }}
{{- end }}
