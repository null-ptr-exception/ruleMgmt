{{- $chunks := chunk 100 ($.Values.zero | default list) }}
{{- range $chunkIndex, $rows := $chunks }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $.Release.Name }}-zero-1-{{ add1 $chunkIndex }}
  labels:
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: zero
      interval: '0'
      rules:
        {{- range $rows }}
        - alert: DiskGone
          expr: |-
            disk_free_bytes{device="{{ .device }}"} == 0
          for: '0'
          keep_firing_for: '0'
          labels:
            severity: critical
        {{- end }}
{{- end }}
