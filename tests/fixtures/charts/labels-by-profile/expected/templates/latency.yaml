{{- $chunks := chunk 100 ($.Values.latency | default list) }}
{{- range $chunkIndex, $rows := $chunks }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $.Release.Name }}-latency-1-{{ add1 $chunkIndex }}
  labels:
    app.kubernetes.io/managed-by: Helm
    release: kps
    team: shop
    owner: platform
spec:
  groups:
    - name: latency
      rules:
        {{- range $rows }}
        - alert: SlowRequests
          expr: |-
            histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{job="{{ .job }}"}[5m]))) > 1
          for: 10m
          labels:
            severity: warning
        {{- end }}
{{- end }}
