# Hand-written — never generated. See tests/blind/harness.js.
blind-spc-1-1:
  - name: spc
    rules:
      - alert: SpcErrors
        expr: rate(spc_errors_total{job="api"}[14m]) > 0
        for: 4m
        labels: { severity: warning }
      - alert: SpcErrors
        expr: rate(spc_errors_total{job="worker"}[15m]) > 0
        for: 6m
        labels: { severity: warning }
