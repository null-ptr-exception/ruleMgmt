# rule_files is filled in by the harness: one file per rendered object.
# 100 requests a minute per job throughout, so errors a minute are percent.
# sum() drops the job and no label puts it back: api's and batch's alerts have
# the same labels, and promtool refuses two such at once. Hence a test each.
evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'requests_total{job="api"}'
        values: '0+100x40'
      # 4% until 10m, then 6%: the default threshold is 5%, the default window
      # 5m — over it from 13m (4, 4, 6, 6, 6 = 5.2%), firing 5m later.
      - series: 'errors_total{job="api"}'
        values: '0+4x10 46+6x29'
    alert_rule_test:
      - eval_time: 17m
        alertname: ErrorRateHigh
        exp_alerts: []
      - eval_time: 18m
        alertname: ErrorRateHigh
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations: { summary: "error ratio 6% for api" }

  - interval: 1m
    input_series:
      - series: 'requests_total{job="worker"}'
        values: '0+100x40'
      # 25% until 20m, then none: over its own 20% from the first rate, at 1m,
      # firing after its own 15m.
      - series: 'errors_total{job="worker"}'
        values: '0+25x20 500x19'
    alert_rule_test:
      - eval_time: 15m
        alertname: ErrorRateHigh
        exp_alerts: []
      - eval_time: 16m
        alertname: ErrorRateHigh
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations: { summary: "error ratio 25% for worker" }
      # The rate looks 15m back: 13 of them at 25% (a 5m window would give
      # 15%, which is under its 20%).
      - eval_time: 22m
        alertname: ErrorRateHigh
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations: { summary: "error ratio 21.67% for worker" }
      - eval_time: 24m
        alertname: ErrorRateHigh
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'requests_total{job="batch"}'
        values: '0+100x40'
      # 1%: over its explicit 0, under the default 5%
      - series: 'errors_total{job="batch"}'
        values: '0+1x40'
    alert_rule_test:
      # The first rate is at 1m; for is the default 5m.
      - eval_time: 5m
        alertname: ErrorRateHigh
        exp_alerts: []
      - eval_time: 6m
        alertname: ErrorRateHigh
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations: { summary: "error ratio 1% for batch" }

  - interval: 1m
    input_series:
      # at batch's 0, and under worker's 20%
      - series: 'requests_total{job="batch"}'
        values: '0+100x40'
      - series: 'errors_total{job="batch"}'
        values: '0x40'
      - series: 'requests_total{job="worker"}'
        values: '0+100x40'
      - series: 'errors_total{job="worker"}'
        values: '0+19x40'
      # no row
      - series: 'requests_total{job="cron"}'
        values: '0+100x40'
      - series: 'errors_total{job="cron"}'
        values: '0+90x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: ErrorRateHigh
        exp_alerts: []
