# A rule with no `for` fires on the first evaluation, as in Prometheus — the
# generator adds no `for` of its own.
columns:
  device: { type: string, required: true }

rules:
  - alert: DiskFull
    expr: disk_free_bytes{device="${device}"} == 0
    labels: { severity: critical }
  - alert: DiskLow
    expr: disk_free_bytes{device="${device}"} < 1000
    for: 10m
    labels: { severity: warning }
