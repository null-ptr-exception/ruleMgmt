{{- $chunks := chunk 100 ($.Values.mariadb_saturation_connections | default list) }}
{{- range $chunkIndex, $rows := $chunks }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $.Release.Name }}-mariadb-saturation-connections-1-{{ add1 $chunkIndex }}
  labels:
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: mariadb-saturation-connections
      rules:
        {{- $common := $.Values._common | default dict }}
        {{- range $rows }}
        {{- $row := merge . $common }}
        - alert: MariadbSaturationConnections_WarnPct
          expr: |-
            (mysql_global_status_threads_connected{namespace="{{ dig "namespace" `default` $row }}"} / mysql_global_variables_max_connections{namespace="{{ dig "namespace" `default` $row }}"}) * 100 > {{ dig "warn_pct" 70 $row }}
          for: 5m
          labels:
            severity: warning
            owner: "{{ $row.owner }}"
            namespace: "{{ dig "namespace" `default` $row }}"
          annotations:
            summary: |-
              MariadbSaturationConnections_WarnPct triggered on {{ $row.owner }}
        - alert: MariadbSaturationConnections_CriticalPct
          expr: |-
            (mysql_global_status_threads_connected{namespace="{{ dig "namespace" `default` $row }}"} / mysql_global_variables_max_connections{namespace="{{ dig "namespace" `default` $row }}"}) * 100 > {{ dig "critical_pct" 90 $row }}
          for: 5m
          labels:
            severity: critical
            owner: "{{ $row.owner }}"
            namespace: "{{ dig "namespace" `default` $row }}"
          annotations:
            summary: |-
              MariadbSaturationConnections_CriticalPct triggered on {{ $row.owner }}
        {{- end }}
{{- end }}
