# Hand-written — never generated. See tests/blind/harness.js.
blind-jobs-1-1:
  - name: jobs
    interval: 30s
    limit: 10
    rules:
      - alert: JobAbsent
        expr: absent(up{job="api"})
        for: 2m
        keep_firing_for: 5m
        labels: { severity: warning }
      - alert: JobFlapping
        expr: changes(up{job="api"}[10m]) > 3
        for: 1m
        keep_firing_for: 15m
        labels: { severity: info }
      - alert: JobAbsent
        expr: absent(up{job="worker"})
        for: 2m
        keep_firing_for: 5m
        labels: { severity: warning }
      # worker leaves linger out: the alert stays, without keep_firing_for
      - alert: JobFlapping
        expr: changes(up{job="worker"}[10m]) > 3
        for: 1m
        labels: { severity: info }
