{{- $chunks := chunk 100 ($.Values.zero_logs | default list) }}
{{- range $chunkIndex, $rows := $chunks }}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: {{ $.Release.Name }}-zero-logs-1-{{ add1 $chunkIndex }}
  labels:
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: zero-logs
      type: vlogs
      interval: '0'
      rules:
        {{- range $rows }}
        - alert: LogErrors
          expr: |-
            _time:5m service:"{{ .service }}" level:error | stats count() as errors | filter errors:>0
          for: '0'
          keep_firing_for: '0'
          labels:
            severity: warning
        {{- end }}
{{- end }}
